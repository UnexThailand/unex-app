<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNEX - System Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Kanit', sans-serif; background-color: #f3f4f6; }
        .section-tab { display: none; }
        .section-tab.active { display: block; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-gray-900 text-white flex flex-col h-full shadow-2xl z-20 hidden md:flex">
        <div class="p-6 text-2xl font-bold text-red-500 tracking-widest border-b border-gray-800">UNEX ADMIN</div>
        <nav class="flex-1 p-4 space-y-2">
            <button onclick="nav('settings')" id="btn-settings" class="w-full text-left p-3 rounded-lg bg-gray-800 text-red-400 font-medium transition">🎨 ปรับแต่งธีมแอป</button>
            <button onclick="nav('news')" id="btn-news" class="w-full text-left p-3 rounded-lg text-gray-400 hover:bg-gray-800 hover:text-white transition">📰 ประกาศข่าวสาร</button>
            <button onclick="nav('events')" id="btn-events" class="w-full text-left p-3 rounded-lg text-gray-400 hover:bg-gray-800 hover:text-white transition">📅 จัดการอีเวนต์</button>
            <button onclick="nav('brands')" id="btn-brands" class="w-full text-left p-3 rounded-lg text-gray-400 hover:bg-gray-800 hover:text-white transition">🏎️ จัดการแบรนด์รถ</button>
            <button onclick="nav('shop')" id="btn-shop" class="w-full text-left p-3 rounded-lg text-gray-400 hover:bg-gray-800 hover:text-white transition">🛒 ระบบสินค้า (Shop)</button>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 h-full overflow-y-auto bg-gray-100 p-8">
        
        <!-- Section: Settings -->
        <section id="sec-settings" class="section-tab active max-w-2xl mx-auto">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">🎨 ปรับแต่งหน้าตาแอป (Theme & Branding)</h2>
            <form onsubmit="submitForm(event, 'admin_saveSettings')" class="bg-white p-6 rounded-2xl shadow-sm space-y-4">
                <div><label class="block text-sm font-semibold text-gray-700 mb-1">ชื่อเว็บ / สโลแกน</label>
                <input type="text" id="siteName" class="w-full border rounded-lg p-3 bg-gray-50 focus:ring-2 focus:ring-red-500 outline-none" placeholder="เช่น UNEX CLUB"></div>
                
                <div><label class="block text-sm font-semibold text-gray-700 mb-1">สีหลักของแอป (HEX Code)</label>
                <input type="text" id="themeColor" class="w-full border rounded-lg p-3 bg-gray-50 focus:ring-2 focus:ring-red-500 outline-none" placeholder="#dc2626"></div>
                
                <div><label class="block text-sm font-semibold text-gray-700 mb-1">อัปโหลดโลโก้เว็บใหม่</label>
                <input type="file" id="logoImg" accept="image/*" class="w-full border rounded-lg p-2 bg-gray-50 text-sm"></div>
                
                <button type="submit" class="w-full bg-red-600 text-white font-bold py-3 rounded-lg hover:bg-red-700">บันทึกการตั้งค่า</button>
            </form>
        </section>

        <!-- Section: News -->
        <section id="sec-news" class="section-tab max-w-2xl mx-auto">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">📰 โพสต์ประกาศข่าวสาร</h2>
            <form onsubmit="submitForm(event, 'admin_addNews')" class="bg-white p-6 rounded-2xl shadow-sm space-y-4">
                <input type="text" id="newsTitle" required placeholder="หัวข้อข่าวสาร" class="w-full border rounded-lg p-3 bg-gray-50">
                <textarea id="newsContent" required placeholder="รายละเอียดเนื้อหาประกาศ..." class="w-full border rounded-lg p-3 bg-gray-50 h-32"></textarea>
                <input type="file" id="newsImg" accept="image/*" class="w-full border rounded-lg p-2 bg-gray-50 text-sm">
                <button type="submit" class="w-full bg-gray-800 text-white font-bold py-3 rounded-lg hover:bg-gray-900">โพสต์ข่าวสาร</button>
            </form>
        </section>

        <!-- Section: Events -->
        <section id="sec-events" class="section-tab max-w-2xl mx-auto">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">📅 สร้างอีเวนต์ใหม่</h2>
            <form onsubmit="submitForm(event, 'admin_addEvent')" class="bg-white p-6 rounded-2xl shadow-sm space-y-4">
                <input type="text" id="evtTitle" required placeholder="ชื่องาน (เช่น UNEX Grand Meet 2026)" class="w-full border rounded-lg p-3 bg-gray-50">
                <input type="datetime-local" id="evtDate" required class="w-full border rounded-lg p-3 bg-gray-50">
                <input type="text" id="evtLocation" required placeholder="สถานที่จัดงาน (Location)" class="w-full border rounded-lg p-3 bg-gray-50">
                <div><label class="block text-sm font-semibold text-gray-700 mb-1">ภาพหน้าปกอีเวนต์</label>
                <input type="file" id="evtImg" accept="image/*" class="w-full border rounded-lg p-2 bg-gray-50 text-sm"></div>
                <button type="submit" class="w-full bg-gray-800 text-white font-bold py-3 rounded-lg hover:bg-gray-900">สร้างอีเวนต์</button>
            </form>
        </section>

        <!-- Section: Brands -->
        <section id="sec-brands" class="section-tab max-w-2xl mx-auto">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">🏎️ เพิ่มแบรนด์และรุ่นรถ</h2>
            <form onsubmit="submitForm(event, 'admin_addBrand')" class="bg-white p-6 rounded-2xl shadow-sm space-y-4">
                <input type="text" id="brName" required placeholder="ชื่อยี่ห้อ (เช่น BMW, Toyota)" class="w-full border rounded-lg p-3 bg-gray-50">
                <input type="text" id="brModels" placeholder="รุ่นรถที่มีให้เลือก (คั่นด้วยคอมมา เช่น M3,M5,320d)" class="w-full border rounded-lg p-3 bg-gray-50">
                <div><label class="block text-sm font-semibold text-gray-700 mb-1">โลโก้แบรนด์รถ</label>
                <input type="file" id="brImg" accept="image/*" class="w-full border rounded-lg p-2 bg-gray-50 text-sm"></div>
                <button type="submit" class="w-full bg-gray-800 text-white font-bold py-3 rounded-lg hover:bg-gray-900">เพิ่มฐานข้อมูลรถ</button>
            </form>
        </section>

        <!-- Section: Shop -->
        <section id="sec-shop" class="section-tab max-w-2xl mx-auto">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">🛒 เพิ่มสินค้าใหม่ (Shop)</h2>
            <form onsubmit="submitForm(event, 'admin_addShopItem')" class="bg-white p-6 rounded-2xl shadow-sm space-y-4">
                <input type="text" id="shopName" required placeholder="ชื่อสินค้า (เช่น เสื้อยืด UNEX)" class="w-full border rounded-lg p-3 bg-gray-50">
                <textarea id="shopDesc" required placeholder="รายละเอียดสินค้า..." class="w-full border rounded-lg p-3 bg-gray-50 h-24"></textarea>
                <input type="number" id="shopPrice" required placeholder="ราคา (บาท)" class="w-full border rounded-lg p-3 bg-gray-50">
                <div><label class="block text-sm font-semibold text-gray-700 mb-1">รูปภาพสินค้า</label>
                <input type="file" id="shopImg" required accept="image/*" class="w-full border rounded-lg p-2 bg-gray-50 text-sm"></div>
                <button type="submit" class="w-full bg-gray-800 text-white font-bold py-3 rounded-lg hover:bg-gray-900">วางขายสินค้า</button>
            </form>
        </section>

    </main>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbwPZXAmJXrYHRg6h-IciW8TdfBTkOGNV1hxU85yvmyOsTGV3CpYS5g5rJQ3B6UJE-xaSw/exec';
        let adminPwd = '';

        // 1. ระบบยืนยันตัวตนแอดมิน
        window.onload = async () => {
            const { value: pwd } = await Swal.fire({ title: 'Admin Login', input: 'password', allowOutsideClick: false });
            if (pwd) adminPwd = pwd;
        };

        // 2. ระบบ Navigation
        function nav(section) {
            document.querySelectorAll('.section-tab').forEach(el => el.classList.remove('active'));
            document.getElementById(`sec-${section}`).classList.add('active');
            
            // จัดการสีปุ่ม Sidebar
            const btns = ['settings', 'news', 'events', 'brands', 'shop'];
            btns.forEach(b => {
                document.getElementById(`btn-${b}`).className = 'w-full text-left p-3 rounded-lg text-gray-400 hover:bg-gray-800 hover:text-white transition';
            });
            document.getElementById(`btn-${section}`).className = 'w-full text-left p-3 rounded-lg bg-gray-800 text-red-400 font-medium transition';
        }

        // 3. ฟังก์ชันหลักสำหรับแปลงไฟล์และส่งข้อมูลไปยังเซิร์ฟเวอร์
        async function submitForm(e, actionType) {
            e.preventDefault();
            Swal.fire({ title: 'กำลังประมวลผล...', text: 'กำลังอัปโหลดรูปภาพและบันทึกข้อมูล', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); }});

            let payload = { action: actionType, pwd: adminPwd };
            let fileInput = null;

            // รวบรวมข้อมูลตามประเภทที่แอดมินกำลังกดส่ง
            if (actionType === 'admin_saveSettings') {
                payload.siteName = document.getElementById('siteName').value;
                payload.themeColor = document.getElementById('themeColor').value;
                fileInput = document.getElementById('logoImg');
            } else if (actionType === 'admin_addNews') {
                payload.title = document.getElementById('newsTitle').value;
                payload.content = document.getElementById('newsContent').value;
                fileInput = document.getElementById('newsImg');
            } else if (actionType === 'admin_addEvent') {
                payload.title = document.getElementById('evtTitle').value;
                payload.date = document.getElementById('evtDate').value;
                payload.location = document.getElementById('evtLocation').value;
                fileInput = document.getElementById('evtImg');
            } else if (actionType === 'admin_addBrand') {
                payload.brandName = document.getElementById('brName').value;
                payload.models = document.getElementById('brModels').value;
                fileInput = document.getElementById('brImg');
            } else if (actionType === 'admin_addShopItem') {
                payload.itemName = document.getElementById('shopName').value;
                payload.desc = document.getElementById('shopDesc').value;
                payload.price = document.getElementById('shopPrice').value;
                fileInput = document.getElementById('shopImg');
            }

            // ถ้ามีการแนบรูปภาพ ให้ทำการแปลงเป็น Base64 ก่อนส่ง
            if (fileInput && fileInput.files.length > 0) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    payload.imageBase64 = event.target.result;
                    sendData(payload, e.target);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                sendData(payload, e.target); // ถ้าไม่มีรูป ก็ส่งข้อมูลเพียวๆ
            }
        }

        // 4. ส่งข้อมูล HTTP POST
        function sendData(payload, formElement) {
            fetch(GAS_URL, {
                method: 'POST', mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(() => {
                Swal.fire('สำเร็จ!', 'อัปเดตระบบและฐานข้อมูลเรียบร้อยแล้ว', 'success');
                formElement.reset(); // ล้างแบบฟอร์มหลังส่งสำเร็จ
            }).catch(() => {
                Swal.fire('ข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อระบบหลังบ้านได้', 'error');
            });
        }
    </script>
</body>
</html>
