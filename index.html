<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNEX CLUB - Hi-Tech Hub</title>
    <style>
        :root {
            --theme-primary: #dc2626;
            --theme-bg: #050505;
            --theme-card: rgba(255, 255, 255, 0.03);
            --theme-text: #f3f4f6;
            --theme-glow: rgba(220, 38, 38, 0.4);
        }
        
        body { 
            font-family: 'Kanit', sans-serif; 
            background-color: var(--theme-bg);
            /* พื้นหลังสไตล์ Cyber Grid พร้อมแสง Neon สาดจากด้านบน */
            background-image: 
                radial-gradient(circle at 50% -10%, var(--theme-glow) 0%, transparent 60%),
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            background-attachment: fixed;
            color: var(--theme-text);
        } 
        
        .tab-content { display: none; opacity: 0; transition: opacity 0.4s ease-in-out; } 
        .tab-content.active { display: block; opacity: 1; } 
        #map { height: 350px; border-radius: 1rem; z-index: 1; filter: invert(90%) hue-rotate(180deg); /* ทำให้แผนที่เป็น Dark Mode อัตโนมัติ */ } 

        /* Glassmorphism Classes */
        .glass-panel {
            background: var(--theme-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }
        .glass-panel:hover {
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 var(--theme-glow);
        }
        .glass-header {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        /* Neon Button & Input */
        .btn-neon {
            background: linear-gradient(135deg, var(--theme-primary) 0%, #000000 150%);
            box-shadow: 0 0 10px var(--theme-glow);
            border: 1px solid rgba(255,255,255,0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-neon:hover {
            box-shadow: 0 0 20px var(--theme-glow), 0 0 40px var(--theme-glow);
            transform: translateY(-2px);
        }
        .input-hi-tech {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            transition: all 0.3s;
        }
        .input-hi-tech:focus {
            border-color: var(--theme-primary);
            box-shadow: 0 0 15px var(--theme-glow);
            outline: none;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--theme-primary); }

        /* SweetAlert Hi-Tech Override */
        .swal2-popup {
            background: rgba(10, 10, 15, 0.85) !important;
            backdrop-filter: blur(20px) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: var(--theme-text) !important;
            box-shadow: 0 0 40px rgba(0,0,0,0.8), 0 0 10px var(--theme-glow) !important;
            border-radius: 1.5rem !important;
        }
        .swal2-title, .swal2-html-container { color: var(--theme-text) !important; }
        .swal2-input, .swal2-textarea, .swal2-file, .swal2-select {
            background: rgba(0,0,0,0.5) !important;
            border: 1px solid rgba(255,255,255,0.1) !important;
            color: #fff !important;
            border-radius: 0.75rem !important;
        }
        .swal2-input:focus, .swal2-textarea:focus, .swal2-select:focus {
            border-color: var(--theme-primary) !important;
            box-shadow: 0 0 10px var(--theme-glow) !important;
        }
        .swal2-confirm { background: var(--theme-primary) !important; box-shadow: 0 0 15px var(--theme-glow) !important; border-radius: 0.5rem !important; font-weight: bold; }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config={ darkMode:'class', theme:{ extend:{ colors:{ primary:'var(--theme-primary)', textcolor:'var(--theme-text)' } } } }
    </script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="pb-24 transition-colors duration-500">

    <header class="glass-header p-4 sticky top-0 z-50 flex justify-between items-center transition-colors duration-500 shadow-lg">
        <div id="siteLogoArea" class="drop-shadow-[0_0_8px_var(--theme-glow)]"><h1 class="text-xl font-black tracking-widest text-primary uppercase">UNEX CLUB</h1></div>
        <div id="authArea"></div>
    </header>

    <button onclick="viewCart()" id="cartBtn" class="hidden btn-neon fixed bottom-24 right-4 text-white p-4 rounded-full z-50 flex items-center gap-2">🛒 <span id="cartCount" class="font-bold">0</span></button>

    <main class="max-w-lg mx-auto p-4">
        <!-- Tab 1: Community News -->
        <section id="tab-feed" class="tab-content active space-y-5">
            <div class="flex items-center gap-2 border-l-4 border-primary pl-3"><h2 class="text-xl font-bold tracking-wide">SYSTEM FEED</h2></div>
            <input type="text" id="search-news" onkeyup="renderFeed()" placeholder="🔍 ค้นหาหัวข้อข่าว, เนื้อหา..." class="w-full input-hi-tech rounded-xl p-3 text-sm">
            <div id="feedList" class="space-y-5">กำลังโหลด...</div>
        </section>

        <!-- Tab 2: Community Board -->
        <section id="tab-board" class="tab-content space-y-5">
            <div class="flex justify-between items-center border-l-4 border-primary pl-3">
                <h2 class="text-xl font-bold tracking-wide">COMMUNITY</h2>
                <button onclick="openCreatePostModal()" class="btn-neon text-white text-xs px-4 py-2 rounded-full font-bold uppercase tracking-wider">+ Create Data</button>
            </div>
            <div id="boardList" class="space-y-5">กำลังโหลด...</div>
        </section>

        <!-- Tab 3: Brands -->
        <section id="tab-brands" class="tab-content space-y-5">
            <div class="border-l-4 border-primary pl-3">
                <h2 class="text-xl font-bold tracking-wide">DATABASE: BRANDS</h2>
                <p class="text-xs text-neutral-400 mt-1">Access vehicle specifications and owner registry</p>
            </div>
            <div id="brandsList" class="grid grid-cols-2 md:grid-cols-3 gap-4">กำลังโหลด...</div>
        </section>

        <!-- Tab 4: Events -->
        <section id="tab-events" class="tab-content space-y-5">
            <div class="border-l-4 border-primary pl-3"><h2 class="text-xl font-bold tracking-wide">MISSION / EVENTS</h2></div>
            <div id="eventList" class="space-y-4">กำลังโหลด...</div>
            <div class="glass-panel p-2 rounded-2xl"><div id="map"></div></div>
        </section>

        <!-- Tab 5: Shop -->
        <section id="tab-shop" class="tab-content space-y-5">
            <div class="border-l-4 border-primary pl-3"><h2 class="text-xl font-bold tracking-wide">MARKETPLACE</h2></div>
            <div id="shopList" class="grid grid-cols-2 gap-4">กำลังโหลด...</div>
        </section>
    </main>

    <!-- Navigation Bar -->
    <nav class="glass-header fixed bottom-0 w-full pb-safe z-40 flex justify-around p-2 transition-colors duration-500 rounded-t-3xl shadow-[0_-5px_25px_rgba(0,0,0,0.5)]">
        <button onclick="switchTab('feed')" class="nav-btn text-primary text-[10px] w-1/5 p-2 font-bold flex flex-col items-center gap-1 drop-shadow-[0_0_5px_var(--theme-glow)]"><span class="text-xl mb-1">📰</span>News</button>
        <button onclick="switchTab('board')" class="nav-btn text-neutral-500 text-[10px] w-1/5 p-2 font-bold flex flex-col items-center gap-1 hover:text-white transition-colors"><span class="text-xl mb-1">💬</span>Board</button>
        <button onclick="switchTab('brands')" class="nav-btn text-neutral-500 text-[10px] w-1/5 p-2 font-bold flex flex-col items-center gap-1 hover:text-white transition-colors"><span class="text-xl mb-1">🏎️</span>Brands</button>
        <button onclick="switchTab('events')" class="nav-btn text-neutral-500 text-[10px] w-1/5 p-2 font-bold flex flex-col items-center gap-1 hover:text-white transition-colors"><span class="text-xl mb-1">📍</span>Events</button>
        <button onclick="switchTab('shop')" class="nav-btn text-neutral-500 text-[10px] w-1/5 p-2 font-bold flex flex-col items-center gap-1 hover:text-white transition-colors"><span class="text-xl mb-1">🛒</span>Shop</button>
    </nav>

    <!-- Lightbox -->
    <div id="lightbox" class="fixed inset-0 bg-black/95 backdrop-blur-md z-[9999] hidden flex justify-center items-center p-4 cursor-pointer" onclick="this.classList.add('hidden')">
        <img id="lightbox-img" src="" class="max-w-full max-h-[90vh] rounded-2xl object-contain pointer-events-none shadow-[0_0_50px_rgba(255,255,255,0.1)]">
        <button class="absolute top-6 right-6 text-white text-3xl font-bold bg-white/10 w-12 h-12 rounded-full flex items-center justify-center hover:bg-white/20 transition-all border border-white/20">&times;</button>
    </div>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbz17h3VFCpVZKO4Na4tPJ-TA0q65Yuze7KQ4ovoKmbM98xxBXxHWB5DKxX3btfFzR-Xhw/exec';
        let appData = {}, cart = {}, map, marker;
        let userPhone = localStorage.getItem('unexPhone'), userName = localStorage.getItem('unexName'), userImg = localStorage.getItem('unexImg') || '';

        function fixImg(url) {
            if(!url) return '';
            if(url.startsWith('data:image')) return url; 
            const match = url.match(/id=([a-zA-Z0-9_-]+)/) || url.match(/d\/([a-zA-Z0-9_-]+)/);
            return match ? `https://drive.google.com/thumbnail?id=${match[1]}&sz=w1000` : url;
        }
        function parseImages(imgData) {
            if(!imgData) return [];
            if(imgData.startsWith('[')) { try { return JSON.parse(imgData); } catch(e) { return []; } }
            return [imgData];
        }
        function viewFullImg(url) {
            document.getElementById('lightbox-img').src = fixImg(url);
            document.getElementById('lightbox').classList.remove('hidden');
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            setTimeout(() => document.getElementById(`tab-${tab}`).classList.add('active'), 50); // slight delay for smooth fade
            
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.className = 'nav-btn text-neutral-500 text-[10px] w-1/5 p-2 font-bold flex flex-col items-center gap-1 hover:text-white transition-colors';
                btn.style.filter = 'none';
            });
            let activeBtn = event.currentTarget;
            activeBtn.className = 'nav-btn text-primary text-[10px] w-1/5 p-2 font-bold flex flex-col items-center gap-1 drop-shadow-[0_0_8px_var(--theme-glow)] transition-all';
            
            if(tab==='events' && map) setTimeout(()=>map.invalidateSize(), 100);
        }

        function hexToRgba(hex, alpha) {
            let c;
            if(/^#([A-Fa-f0-9]{3}){1,2}$/.test(hex)){
                c = hex.substring(1).split('');
                if(c.length === 3){ c = [c[0], c[0], c[1], c[1], c[2], c[2]]; }
                c = '0x' + c.join('');
                return 'rgba('+[(c>>16)&255, (c>>8)&255, c&255].join(',')+','+alpha+')';
            }
            return `rgba(220,38,38,${alpha})`;
        }

        async function init() {
            renderAuthUI();
            try {
                const res = await fetch(`${GAS_URL}?action=getAppData`);
                appData = await res.json();
                
                const root = document.documentElement;
                if(appData.config.ColorPrimary) {
                    root.style.setProperty('--theme-primary', appData.config.ColorPrimary);
                    root.style.setProperty('--theme-glow', hexToRgba(appData.config.ColorPrimary, 0.5));
                }
                if(appData.config.ColorBg) root.style.setProperty('--theme-bg', appData.config.ColorBg);
                if(appData.config.ColorCard) root.style.setProperty('--theme-card', appData.config.ColorCard);
                if(appData.config.ColorText) root.style.setProperty('--theme-text', appData.config.ColorText);
                
                if(appData.config.LogoImg) {
                    document.getElementById('siteLogoArea').innerHTML = `<img src="${fixImg(appData.config.LogoImg)}" class="h-10 object-contain drop-shadow-[0_0_10px_rgba(255,255,255,0.5)]">`;
                } else if(appData.config.SiteName) {
                    document.getElementById('siteLogoArea').innerHTML = `<h1 class="text-xl font-black tracking-widest text-primary uppercase">${appData.config.SiteName}</h1>`;
                }
                
                if(userPhone && appData.users) {
                    let myProfile = appData.users.find(u => String(u[0]||'').replace(/'/g, '') === String(userPhone).replace(/'/g, ''));
                    if(myProfile) {
                        userName = myProfile[1]; 
                        userImg = myProfile[3] || '';
                        localStorage.setItem('unexName', userName); 
                        localStorage.setItem('unexImg', userImg);
                        renderAuthUI();
                    }
                }

                renderFeed(); renderBoard(); renderBrands(); renderEvents(); renderShop();

                let now = new Date().getTime();
                let popupList = (appData.popups || []).filter(p => {
                    if (p[4] && String(p[4]).trim() !== '') {
                        let expDate = new Date(p[4]).getTime();
                        if (now > expDate) return false; 
                    }
                    return true;
                }); 
                
                let activePopup = popupList[popupList.length - 1]; 

                if (activePopup && !sessionStorage.getItem('seenPopup_' + activePopup[0])) {
                    sessionStorage.setItem('seenPopup_' + activePopup[0], 'true');
                    let imgTag = activePopup[3] ? `<img src="${fixImg(activePopup[3])}" class="w-full rounded-xl mb-3 shadow-[0_0_15px_rgba(0,0,0,0.5)]">` : '';
                    Swal.fire({
                        title: `<span class="text-primary font-black uppercase tracking-widest">📢 ${activePopup[1]}</span>`,
                        html: `${imgTag}<div class="text-left text-sm text-neutral-300 whitespace-pre-line leading-relaxed">${activePopup[2]}</div>`,
                        confirmButtonText: 'ACKNOWLEDGE',
                        customClass: { confirmButton: 'btn-neon px-6 py-2 rounded-lg font-bold' }
                    });
                }
            } catch(e) { console.log("Init Error:", e); }
        }

        function renderAuthUI() {
            const area = document.getElementById('authArea');
            if(userPhone) {
                let avatar = userImg ? `<img src="${fixImg(userImg)}" class="w-9 h-9 rounded-full object-cover border-2 border-primary shadow-[0_0_10px_var(--theme-glow)]">` : `<div class="w-9 h-9 rounded-full bg-white/10 border border-white/20 flex items-center justify-center text-xs">👤</div>`;
                area.innerHTML = `<div class="flex items-center gap-3 cursor-pointer hover:opacity-80 transition-opacity" onclick="openProfileModal()">${avatar}<span class="text-sm font-bold tracking-wide text-textcolor">${userName}</span></div>`;
            } else {
                area.innerHTML = `<div class="flex gap-2"><button onclick="showLoginForm()" class="text-[10px] md:text-xs btn-neon text-white px-4 py-2 rounded-lg font-bold uppercase tracking-wider">LOGIN</button><button onclick="showRegisterForm()" class="text-[10px] md:text-xs bg-white/10 hover:bg-white/20 text-white px-4 py-2 rounded-lg border border-white/20 font-bold uppercase tracking-wider transition-all">REGISTER</button></div>`;
            }
        }

        function renderFeed() {
            let search = v('search-news').toLowerCase();
            let html = '';
            let filteredNews = (appData.news || []).filter(n => String(n[1]||'').toLowerCase().includes(search) || String(n[2]||'').toLowerCase().includes(search));

            filteredNews.forEach(n => { 
                let postComments = (appData.comments || []).filter(c => String(c[1]) === String(n[0]));
                let imgHtml = (n[3] && String(n[3]).trim() !== '') ? `<img src="${fixImg(n[3])}" class="w-full object-cover max-h-96">` : '';
                html += `<div class="glass-panel rounded-2xl overflow-hidden mb-5 flex flex-col"><div class="p-4 font-bold text-sm border-b border-white/10 flex justify-between items-center"><span class="text-primary text-base uppercase tracking-wide drop-shadow-[0_0_5px_var(--theme-glow)]">${n[1]||''}</span><span class="text-[10px] text-neutral-400 bg-black/40 px-2 py-1 rounded-full">${n[4]||n[3]||''}</span></div>${imgHtml}<div class="p-4 space-y-3 text-sm"><p class="text-neutral-300 line-clamp-3 leading-relaxed">${n[2]||''}</p><button onclick="readMore('news', '${n[0]}')" class="text-primary text-xs font-bold uppercase tracking-wider hover:drop-shadow-[0_0_5px_var(--theme-glow)] transition-all">➔ READ MORE</button><div class="border-t border-white/10 pt-3 space-y-2">${postComments.map(c => { let cImg = c[6] ? `<img src="${fixImg(c[6])}" class="w-6 h-6 rounded-full object-cover border border-white/10">` : `<div class="w-6 h-6 rounded-full bg-white/10 flex items-center justify-center text-[10px]">👤</div>`; let cleanCPhone = String(c[2]||'').replace(/'/g, ''); let cleanUserPhone = String(userPhone||'').replace(/'/g, ''); return `<div class="text-xs bg-black/30 p-2 rounded-xl border border-white/5 flex justify-between items-center"><div class="flex items-center gap-2 cursor-pointer" onclick="viewUserProfile('${cleanCPhone}', '${c[3]}', '${c[6]||''}')">${cImg}<span><b class="text-primary">${c[3]}:</b> ${c[4]}</span></div>${cleanCPhone === cleanUserPhone ? `<button onclick="editComment('${c[0]}', '${c[4]}')" class="text-neutral-500 hover:text-white transition-colors">✏️</button>` : ''}</div>`; }).join('')}</div><div class="flex gap-2 pt-2"><input type="text" id="cmt-${n[0]}" placeholder="Transmitting message..." class="w-full input-hi-tech rounded-xl px-3 py-2 text-xs"><button onclick="postComment('${n[0]}')" class="btn-neon text-white text-xs px-4 py-2 rounded-xl font-bold uppercase">Send</button></div></div></div>`;
            });
            document.getElementById('feedList').innerHTML = html || '<p class="text-center text-sm text-neutral-500 py-8">NO DATA FOUND</p>';
        }

        function renderBoard() {
            let html = '';
            let posts = [...(appData.communityPosts || [])].reverse(); 
            posts.forEach(p => {
                let postComments = (appData.communityComments || []).filter(c => String(c[0]) === String(p[0]));
                let imgHtml = (p[3] && String(p[3]).trim() !== '') ? `<img src="${fixImg(p[3])}" onclick="viewFullImg('${p[3]}')" class="w-full object-cover max-h-[28rem] mt-3 rounded-xl cursor-pointer border border-white/10 shadow-[0_5px_15px_rgba(0,0,0,0.5)]">` : '';
                let cleanPhone = String(p[1]||'').replace(/'/g, '');
                let author = (appData.users || []).find(u => String(u[0]||'').replace(/'/g, '') === cleanPhone);
                let authorImg = author && author[3] ? `<img src="${fixImg(author[3])}" class="w-10 h-10 rounded-full object-cover border-2 border-white/20">` : `<div class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center text-sm border border-white/20">👤</div>`;

                html += `<div class="glass-panel rounded-2xl p-4 mb-5"><div class="flex items-center gap-3 mb-3 cursor-pointer" onclick="viewUserProfile('${cleanPhone}', '${p[2]}', '${author?author[3]:''}')">${authorImg}<div><div class="font-bold text-sm text-primary tracking-wider uppercase">${p[2]}</div><div class="text-[10px] text-neutral-500 font-mono">ID: ${p[0]}</div></div></div><p class="text-sm text-neutral-200 whitespace-pre-line leading-relaxed">${p[4] || ''}</p>${imgHtml}<div class="flex items-center gap-4 mt-4 border-t border-white/10 pt-3"><button onclick="likePost('${p[0]}')" class="text-xs text-neutral-400 hover:text-primary hover:drop-shadow-[0_0_5px_var(--theme-glow)] flex items-center gap-1 transition-all"><span class="text-lg">⚡</span> <span id="like-${p[0]}" class="font-mono text-sm">${p[5] || 0}</span></button><span class="text-xs text-neutral-400 font-mono">💬 ${postComments.length}</span></div><div class="mt-3 space-y-2">${postComments.map(c => { let cCleanPhone = String(c[1]||'').replace(/'/g, ''); let cAuthor = (appData.users || []).find(u => String(u[0]||'').replace(/'/g, '') === cCleanPhone); let cImg = cAuthor && cAuthor[3] ? `<img src="${fixImg(cAuthor[3])}" class="w-6 h-6 rounded-full object-cover border border-white/10">` : `<div class="w-6 h-6 rounded-full bg-white/10 flex items-center justify-center text-[10px]">👤</div>`; return `<div class="text-xs bg-black/30 p-2.5 rounded-xl border border-white/5 flex items-start gap-2">${cImg} <span class="leading-relaxed mt-0.5"><b class="text-primary cursor-pointer hover:underline uppercase tracking-wide" onclick="viewUserProfile('${cCleanPhone}', '${c[2]}', '${cAuthor?cAuthor[3]:''}')">${c[2]}:</b> ${c[3]}</span></div>`; }).join('')}</div><div class="flex gap-2 pt-3 mt-2 border-t border-white/5"><input type="text" id="bc-${p[0]}" placeholder="Add comment..." class="w-full input-hi-tech rounded-xl px-3 py-2 text-xs"><button onclick="postBoardComment('${p[0]}')" class="bg-white/10 hover:bg-white/20 border border-white/20 text-white text-xs px-4 py-2 rounded-xl font-bold uppercase transition-all">Reply</button></div></div>`;
            });
            document.getElementById('boardList').innerHTML = html || '<p class="text-center text-sm text-neutral-500 py-8 font-mono">NO DATA IN LOG</p>';
        }

        function renderBrands() {
            let html = '';
            (appData.brands || []).forEach(b => {
                let imgHtml = (b[3] && String(b[3]).trim() !== '') ? `<img src="${fixImg(b[3])}" class="w-full h-24 object-cover rounded-t-xl opacity-80 group-hover:opacity-100 transition-opacity">` : `<div class="w-full h-24 bg-black/50 flex items-center justify-center text-xs text-neutral-600 rounded-t-xl font-mono uppercase tracking-widest">No Image</div>`;
                html += `
                <div class="glass-panel group rounded-xl overflow-hidden cursor-pointer flex flex-col relative" onclick="viewBrandCars('${b[1]}')">
                    <div class="absolute inset-0 bg-gradient-to-t from-black via-black/50 to-transparent z-10"></div>
                    ${imgHtml}
                    <div class="absolute bottom-0 w-full p-2 text-center z-20">
                        <h4 class="font-black text-sm text-white tracking-widest uppercase drop-shadow-[0_0_5px_var(--theme-primary)] group-hover:text-primary transition-colors">${b[1]}</h4>
                    </div>
                </div>`;
            });
            document.getElementById('brandsList').innerHTML = html || '<p class="text-center text-sm text-neutral-500 py-8 w-full col-span-2 md:col-span-3 font-mono">NO BRANDS REGISTERED</p>';
        }

        function viewBrandCars(brandName) {

            let brandOpts = (appData.brands||[]).map(b => `<option value="${b[1]}">${b[1]}</option>`).join('');
            const { value: form } = await Swal.fire({ title: '<span class="uppercase tracking-widest font-black text-primary">NEW OPERATIVE</span>', html: `<input id="r-phone" type="tel" placeholder="ID (PHONE NUMBER)" class="swal2-input uppercase tracking-wider text-sm"><input id="r-name" placeholder="CALLSIGN / NAME" class="swal2-input uppercase tracking-wider text-sm"><select id="r-brand" class="swal2-select text-sm w-[80%] mx-auto mt-4"><option value="">-- SELECT BRAND --</option>${brandOpts}</select><input id="r-car" placeholder="VEHICLE MODEL / PLATE" class="swal2-input uppercase tracking-wider text-sm"><input id="r-pwd" type="password" placeholder="CREATE PIN" class="swal2-input border-primary/50 text-sm">`, showCancelButton: true, confirmButtonText: 'REGISTER', cancelButtonText: 'ABORT', customClass: { confirmButton: 'btn-neon px-6 py-2 rounded-lg font-bold tracking-widest', cancelButton: 'bg-transparent border border-white/20 px-6 py-2 rounded-lg font-bold' }, preConfirm: () => { if(!v('r-phone') || !v('r-name') || !v('r-pwd')) { Swal.showValidationMessage('ID, NAME AND PIN REQUIRED'); return false; } return { phone: v('r-phone'), name: v('r-name'), brand: v('r-brand'), car: v('r-car'), pwd: v('r-pwd') } } });
            if(form) { Swal.fire({title:'REGISTERING...', didOpen:()=>Swal.showLoading()}); await fetch(GAS_URL, {method:'POST', mode:'no-cors', body: JSON.stringify({action:'register', phone:form.phone, name:form.name, carData: `${form.brand} ${form.car}`, pwd:form.pwd})}); localStorage.setItem('unexPhone', form.phone); localStorage.setItem('unexName', form.name); localStorage.setItem('unexImg', ''); Swal.fire({title: 'REGISTRATION COMPLETE', icon: 'success', customClass: { confirmButton: 'btn-neon px-6 py-2 rounded-lg' }}).then(()=>location.reload()); }
        }

        function logout() { localStorage.clear(); location.reload(); }
        function checkAuth() { if(!userPhone) { showLoginForm(); return false; } return true; }

        function readMore(type, id) {
            let title = '', html = '', imgTag = '';
            if (type === 'news') { let r = appData.news.find(x => String(x[0])===String(id)); title = `<span class="uppercase tracking-widest font-black text-primary">${r[1]||''}</span>`; imgTag = r[3] ? `<img src="${fixImg(r[3])}" class="w-full rounded-xl mb-4 border border-white/10 shadow-[0_0_15px_rgba(0,0,0,0.5)]">` : ''; html = `${imgTag}<div class="text-left text-sm text-neutral-300 whitespace-pre-line leading-relaxed">${r[2]||''}</div>`; } else if (type === 'event') { let r = appData.events.find(x => String(x[0])===String(id)); title = `<span class="uppercase tracking-widest font-black text-primary">${r[1]||''}</span>`; imgTag = r[6] ? `<img src="${fixImg(r[6])}" class="w-full rounded-xl mb-4 border border-white/10 shadow-[0_0_15px_rgba(0,0,0,0.5)]">` : ''; let dateStr = r[2] ? new Date(r[2]).toLocaleString('th-TH') : ''; html = `${imgTag}<div class="text-left text-sm text-neutral-300 whitespace-pre-line leading-relaxed"><b class="text-white uppercase tracking-wider">Location:</b> ${r[3]||''}<br><b class="text-white uppercase tracking-wider">Time:</b> ${dateStr}<br><br><div class="p-3 bg-black/40 border border-white/10 rounded-xl">${r[7]||'No additional data.'}</div></div>`; } else if (type === 'shop') { let r = appData.shop.find(x => String(x[0])===String(id)); title = `<span class="uppercase tracking-widest font-black text-primary drop-shadow-[0_0_5px_var(--theme-glow)]">${r[1]||''}</span>`; imgTag = r[4] ? `<img src="${fixImg(r[4])}" class="w-full rounded-xl mb-4 border border-white/10 shadow-[0_0_15px_rgba(0,0,0,0.5)]">` : ''; html = `${imgTag}<div class="text-left text-sm text-neutral-300 whitespace-pre-line mb-4 leading-relaxed">${r[2]||'No specs available.'}</div><div class="text-left font-black text-2xl text-primary drop-shadow-[0_0_8px_var(--theme-glow)]">฿${r[3]||0}</div>`; }
            Swal.fire({ title: title, html: html, confirmButtonText: 'CLOSE DATA', customClass: { confirmButton: 'bg-white/10 border border-white/20 hover:bg-white/20 text-white px-6 py-2 rounded-lg font-bold tracking-widest uppercase transition-all' } });
        }

        async function postComment(newsId) { if(!checkAuth()) return; const text = v(`cmt-${newsId}`); if(!text) return; document.getElementById(`cmt-${newsId}`).value = ''; if(!appData.comments) appData.comments = []; appData.comments.push([new Date().getTime(), newsId, userPhone, userName, text, 'Just now', userImg]); renderFeed(); await fetch(GAS_URL, {method:'POST', mode:'no-cors', body: JSON.stringify({action:'addComment', newsId:newsId, phone:userPhone, name:userName, text:text, profileImg:userImg})}); }
        async function editComment(commentId, oldText) { const { value: newText } = await Swal.fire({ title: '<span class="uppercase tracking-widest font-bold">EDIT LOG</span>', input: 'text', inputValue: oldText, customClass: { confirmButton: 'btn-neon px-6 py-2 rounded-lg' } }); if(newText && newText !== oldText) { appData.comments.find(c => String(c[0])===String(commentId))[4] = newText; renderFeed(); await fetch(GAS_URL, {method:'POST', mode:'no-cors', body: JSON.stringify({action:'editComment', commentId:commentId, text:newText})}); } }

        function initMap(lat, lng, title) { if(!map) { map = L.map('map').setView([lat, lng], 15); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map); } pinMap(lat, lng, title); }
        function pinMap(lat, lng, title) { if(!map || !lat || !lng) return; if(marker) map.removeLayer(marker); map.setView([lat, lng], 15); marker = L.marker([lat, lng]).addTo(map).bindPopup(`<b class="uppercase tracking-widest">${title}</b>`).openPopup(); }

        function addCart(id, name, price) { if(!checkAuth()) return; if(cart[id]) cart[id].qty++; else cart[id] = { name, price, qty: 1 }; let qty = Object.values(cart).reduce((s, i) => s + i.qty, 0); document.getElementById('cartCount').innerText = qty; document.getElementById('cartBtn').style.display = qty > 0 ? 'flex' : 'none'; }
        
        async function viewCart() {
            let total = 0, html = `<div class="text-left text-sm max-h-60 overflow-y-auto mb-5 border-b border-white/10 pb-3 custom-scrollbar">`;
            for(let id in cart) {
                let item = cart[id]; total += (item.price * item.qty);
                html += `<div class="flex justify-between items-center bg-black/30 p-2 rounded-xl border border-white/5 mb-2"><div class="pl-1"><b class="uppercase tracking-wide text-white drop-shadow-md">${item.name}</b><br><span class="text-primary font-bold">฿${item.price}</span></div><div class="flex items-center gap-3 bg-black/50 px-2 py-1 rounded-lg border border-white/10"><button onclick="cart['${id}'].qty--; if(cart['${id}'].qty<=0) delete cart['${id}']; Swal.close(); viewCart();" class="text-white hover:text-primary font-bold px-1 transition-colors">-</button><span class="font-mono font-bold">${item.qty}</span><button onclick="cart['${id}'].qty++; Swal.close(); viewCart();" class="text-white hover:text-primary font-bold px-1 transition-colors">+</button></div></div>`;
            }
            html += `</div><div class="flex justify-between items-center"><h3 class="font-bold text-sm tracking-widest text-neutral-400 uppercase">Total Amount</h3><h3 class="font-black text-2xl text-primary drop-shadow-[0_0_10px_var(--theme-glow)]">฿${total}</h3></div>`;
            
            let payInfo = '';
            if (appData.config.QRCodeImg && appData.config.QRCodeImg.trim() !== '') {
                payInfo = `<div class="bg-black/40 border border-white/10 p-3 rounded-xl"><div class="uppercase tracking-widest font-bold mb-1 text-white">BANK TRANSFER:</div><b class="text-primary text-sm whitespace-pre-line drop-shadow-md">${appData.config.BankAccount || ''}</b><br><img src="${fixImg(appData.config.QRCodeImg)}" class="mx-auto w-48 h-auto mt-3 rounded-xl border border-white/20 shadow-[0_0_15px_rgba(255,255,255,0.1)]"></div>`;
            } else if (appData.config.PromptPay) {
                payInfo = `<div class="bg-black/40 border border-white/10 p-3 rounded-xl"><div class="uppercase tracking-widest font-bold mb-1 text-white">PROMPTPAY SCAN:</div><b class="text-primary text-sm whitespace-pre-line drop-shadow-md">${appData.config.BankAccount || ''}</b><br><img src="https://promptpay.io/${appData.config.PromptPay}/${total}.png" class="mx-auto w-40 rounded-xl mt-3 border border-white/20"></div>`;
            } else { payInfo = '<div class="bg-black/40 border border-white/10 p-3 rounded-xl font-bold uppercase tracking-widest text-primary">Pay at Location</div>'; }

            const { value, isConfirmed } = await Swal.fire({ title: '<span class="uppercase tracking-widest font-black text-white">CART / CHECKOUT</span>', html: html + `<div class="text-xs text-neutral-300 mt-4">${payInfo}</div><div class="mt-4 text-left"><label class="text-[10px] font-bold text-primary tracking-widest uppercase">ATTACH TRANSFER SLIP</label></div>`, input: 'file', confirmButtonText: 'CONFIRM PAYMENT', showCancelButton: true, customClass: { confirmButton: 'btn-neon px-6 py-2 rounded-lg font-bold tracking-widest', cancelButton: 'bg-transparent border border-white/20 px-6 py-2 rounded-lg font-bold' }, preConfirm: () => { return Swal.getInput()?.files[0]; } });
            if (isConfirmed) { if(!value) return Swal.fire({title: 'ERROR', text: 'Transfer slip required.', icon: 'warning', customClass: { confirmButton: 'btn-neon px-6 py-2 rounded-lg' }}); Swal.fire({title:'PROCESSING...', didOpen:()=>Swal.showLoading()}); const proc = (b64) => { fetch(GAS_URL, {method:'POST', mode:'no-cors', body: JSON.stringify({ action:'checkout', phone:userPhone, cart:cart, total:total, slipBase64:b64 })}).then(() => { cart = {}; document.getElementById('cartBtn').style.display='none'; Swal.fire({title: 'ORDER TRANSMITTED', icon: 'success', customClass: { confirmButton: 'btn-neon px-6 py-2 rounded-lg' }}); }); }; const r = new FileReader(); r.onload = (e) => proc(e.target.result); r.readAsDataURL(value); }
        }

        function v(id) { return document.getElementById(id) ? document.getElementById(id).value : ''; }
        window.onload = init;
    </script>
</body>
</html>
