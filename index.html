<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNEX CLUB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={darkMode:'class',theme:{extend:{colors:{primary:'#dc2626',darkbg:'#0a0a0a',cardbg:'#171717'}}}}</script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style> body { font-family: 'Kanit', sans-serif; } .tab-content { display: none; } .tab-content.active { display: block; } #map { height: 350px; border-radius: 0.75rem; z-index: 1; } </style>
</head>
<body class="bg-darkbg text-gray-100 pb-24">

    <header class="bg-cardbg border-b border-neutral-800 p-4 sticky top-0 z-50 flex justify-between items-center">
        <h1 id="siteName" class="text-xl font-bold tracking-wider text-primary">UNEX CLUB</h1>
        <div id="authArea"></div>
    </header>

    <button onclick="viewCart()" id="cartBtn" class="hidden fixed bottom-20 right-4 bg-primary text-white p-4 rounded-full shadow-2xl z-50 flex items-center gap-2">🛒 <span id="cartCount" class="font-bold">0</span></button>

    <main class="max-w-md mx-auto p-4">
        <section id="tab-feed" class="tab-content active space-y-4"><h2 class="text-lg font-bold">📰 Community News</h2><div id="feedList" class="space-y-4">กำลังโหลด...</div></section>
        <section id="tab-events" class="tab-content space-y-4"><h2 class="text-lg font-bold">📍 Events & Meetups</h2><div id="eventList" class="space-y-3"></div><div class="bg-cardbg p-3 rounded-xl border border-neutral-800"><div id="map"></div></div></section>
        <section id="tab-shop" class="tab-content space-y-4"><h2 class="text-lg font-bold">🛒 Official Shop</h2><div id="shopList" class="grid grid-cols-2 gap-3"></div></section>
    </main>

    <nav class="fixed bottom-0 w-full bg-cardbg border-t border-neutral-800 pb-safe z-40 flex justify-around p-2">
        <button onclick="switchTab('feed')" class="nav-btn text-primary text-xs w-1/3 p-2 font-bold">📰 News</button>
        <button onclick="switchTab('events')" class="nav-btn text-neutral-500 text-xs w-1/3 p-2 font-bold">📅 Events</button>
        <button onclick="switchTab('shop')" class="nav-btn text-neutral-500 text-xs w-1/3 p-2 font-bold">🛍️ Shop</button>
    </nav>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbwPZXAmJXrYHRg6h-IciW8TdfBTkOGNV1hxU85yvmyOsTGV3CpYS5g5rJQ3B6UJE-xaSw/exec';
        let appData = {}, cart = {}, map, marker;
        let userPhone = localStorage.getItem('unexPhone'), userName = localStorage.getItem('unexName'), userImg = localStorage.getItem('unexImg') || '';

        function fixImg(url) {
            if(!url) return '';
            const match = url.match(/id=([a-zA-Z0-9_-]+)/) || url.match(/d\/([a-zA-Z0-9_-]+)/);
            return match ? `https://drive.google.com/thumbnail?id=${match[1]}&sz=w1000` : url;
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(btn => btn.className = 'nav-btn text-neutral-500 text-xs w-1/3 p-2 font-bold');
            event.currentTarget.className = 'nav-btn text-primary text-xs w-1/3 p-2 font-bold';
            if(tab==='events' && map) setTimeout(()=>map.invalidateSize(), 100);
        }

        async function init() {
            renderAuthUI();
            try {
                const res = await fetch(`${GAS_URL}?action=getAppData`);
                appData = await res.json();
                if(appData.config.SiteName) document.getElementById('siteName').innerText = appData.config.SiteName;
                
                renderFeed(); renderEvents(); renderShop();
            } catch(e) { console.log(e); }
        }

        function renderAuthUI() {
            const area = document.getElementById('authArea');
            if(userPhone) {
                let avatar = userImg ? `<img src="${fixImg(userImg)}" class="w-8 h-8 rounded-full object-cover border border-primary">` : `<div class="w-8 h-8 rounded-full bg-neutral-700 flex items-center justify-center text-xs">👤</div>`;
                area.innerHTML = `<div class="flex items-center gap-2 cursor-pointer" onclick="openProfileModal()">
                    ${avatar}
                    <span class="text-xs font-semibold">${userName}</span>
                </div>`;
            } else {
                area.innerHTML = `<button onclick="profileAuth()" class="text-xs bg-neutral-800 px-3 py-1.5 rounded-full border border-neutral-700">เข้าสู่ระบบ</button>`;
            }
        }

        function renderFeed() {
            let html = '';
            appData.news.forEach(n => { 
                let postComments = appData.comments.filter(c => String(c[1]) === String(n[0]));
                let imgHtml = (n[3] && n[3].trim() !== '') ? `<img src="${fixImg(n[3])}" class="w-full object-cover max-h-96">` : '';
                html += `<div class="bg-cardbg border border-neutral-800 rounded-xl overflow-hidden">
                    <div class="p-3 font-semibold text-sm border-b border-neutral-800">${n[1]} <span class="text-xs text-neutral-500 font-normal ml-2">${n[4]}</span></div>
                    ${imgHtml}
                    <div class="p-3 space-y-2 text-sm">
                        <p class="text-neutral-300 line-clamp-3">${n[2]}</p>
                        <button onclick="readMore('news', '${n[0]}')" class="text-primary text-xs underline">อ่านเพิ่มเติม</button>
                        <div class="border-t border-neutral-800 pt-2 space-y-1">
                            ${postComments.map(c => {
                                let cImg = c[6] ? `<img src="${fixImg(c[6])}" class="w-5 h-5 rounded-full object-cover">` : `<div class="w-5 h-5 rounded-full bg-neutral-700 flex items-center justify-center text-[10px]">👤</div>`;
                                return `<div class="text-xs bg-neutral-900 p-2 rounded flex justify-between items-center">
                                    <div class="flex items-center gap-2 cursor-pointer" onclick="viewUserProfile('${c[2]}', '${c[3]}', '${c[6]||''}')">
                                        ${cImg}
                                        <span><b class="text-primary">${c[3]}:</b> ${c[4]}</span>
                                    </div>
                                    ${String(c[2]) === userPhone ? `<button onclick="editComment('${c[0]}', '${c[4]}')" class="text-neutral-500 hover:text-white">✏️</button>` : ''}
                                </div>`;
                            }).join('')}
                        </div>
                        <div class="flex gap-2 pt-2">
                            <input type="text" id="cmt-${n[0]}" placeholder="แสดงความคิดเห็น..." class="w-full bg-neutral-900 border border-neutral-800 rounded px-2 py-1 text-xs outline-none">
                            <button onclick="postComment('${n[0]}')" class="bg-primary text-white text-xs px-3 py-1 rounded">ส่ง</button>
                        </div>
                    </div></div>`;
            });
            document.getElementById('feedList').innerHTML = html || '<p>ไม่มีข่าวสาร</p>';
        }

        // --- ดูโปรไฟล์คนอื่นจากคอมเมนต์ ---
        function viewUserProfile(phone, name, img) {
            let myCars = (appData.garage || []).filter(car => String(car[1]) === String(phone));
            let avatar = img ? `<img src="${fixImg(img)}" class="w-20 h-20 rounded-full object-cover mx-auto mb-2 border-2 border-primary">` : `<div class="w-20 h-20 rounded-full bg-neutral-700 flex items-center justify-center text-2xl mx-auto mb-2">👤</div>`;
            
            let carsHtml = myCars.length > 0 ? myCars.map(car => `
                <div class="bg-neutral-900 border border-neutral-800 rounded-lg p-3 flex gap-3 text-left mt-2">
                    ${car[7] ? `<img src="${fixImg(car[7])}" class="w-16 h-16 rounded object-cover">` : '<div class="w-16 h-16 bg-neutral-800 rounded flex items-center justify-center text-[10px]">No Car</div>'}
                    <div>
                        <b class="text-primary text-sm">${car[2]} ${car[3]}</b><br>
                        <span class="text-xs text-neutral-400">ปี: ${car[4]} | สี: ${car[5]}</span><br>
                        <span class="text-xs text-neutral-300">${car[6]}</span>
                    </div>
                </div>
            `).join('') : '<p class="text-xs text-neutral-500 mt-2">ยังไม่ได้เพิ่มรถในโรงรถ</p>';

            Swal.fire({
                title: name,
                html: `${avatar}<p class="text-xs text-neutral-400 mb-4">สมาชิก UNEX CLUB</p><div class="border-t border-neutral-800 pt-2 text-left"><b class="text-xs">โรงรถของฉัน:</b><div class="max-h-48 overflow-y-auto">${carsHtml}</div></div>`,
                confirmButtonText: 'ปิด', confirmButtonColor: '#dc2626'
            });
        }

        // --- หน้าโปรไฟล์ตัวเอง & จัดการโรงรถ ---
        async function openProfileModal() {
            let myCars = (appData.garage || []).filter(car => String(car[1]) === String(userPhone));
            let avatar = userImg ? `<img src="${fixImg(userImg)}" class="w-20 h-20 rounded-full object-cover mx-auto mb-2 border-2 border-primary">` : `<div class="w-20 h-20 rounded-full bg-neutral-700 flex items-center justify-center text-2xl mx-auto mb-2">👤</div>`;
            
            let carsHtml = myCars.map(car => `
                <div class="bg-neutral-900 border border-neutral-800 rounded-lg p-2 flex justify-between items-center text-left text-xs mb-2">
                    <div class="flex items-center gap-2">
                        ${car[7] ? `<img src="${fixImg(car[7])}" class="w-10 h-10 rounded object-cover">` : ''}
                        <div><b>${car[2]} ${car[3]}</b> (${car[5]})<br><span class="text-neutral-400">${car[6]}</span></div>
                    </div>
                    <button onclick="deleteCar('${car[0]}')" class="text-red-500 font-bold px-2">ลบ</button>
                </div>
            `).join('');

            const { value: action } = await Swal.fire({
                title: 'โปรไฟล์ของฉัน',
                html: `${avatar}<b>${userName}</b><br><span class="text-xs text-neutral-400">โทร: ${userPhone}</span><br>
                <button onclick="editProfileInfo()" class="bg-neutral-800 text-xs px-3 py-1 rounded mt-2 border border-neutral-700">✏️ แก้ไขชื่อ / รูปโปรไฟล์</button>
                <div class="border-t border-neutral-800 mt-4 pt-2 text-left"><div class="flex justify-between items-center mb-2"><b class="text-xs">โรงรถของฉัน</b><button onclick="openAddCarModal()" class="bg-primary text-white text-[10px] px-2 py-1 rounded">+ เพิ่มรถ</button></div><div class="max-h-40 overflow-y-auto">${carsHtml || '<p class="text-xs text-neutral-500">ยังไม่มีรถในโรงรถ</p>'}</div></div>
                <div class="mt-4"><button onclick="logout()" class="text-red-500 text-xs underline">ออกจากระบบ</button></div>`,
                showConfirmButton: false, showCloseButton: true
            });
        }

        async function editProfileInfo() {
            let brandOpts = appData.brands.map(b => `<option value="${b[1]}">${b[1]}</option>`).join('');
            const { value: form } = await Swal.fire({
                title: 'แก้ไขโปรไฟล์',
                html: `<input id="e-name" value="${userName}" class="swal2-input" placeholder="ชื่อ-นามสกุล"><label class="text-xs text-left block mt-2">เปลี่ยนรูปโปรไฟล์</label><input id="e-img" type="file" class="swal2-file" accept="image/*">`,
                preConfirm: () => { return { name: document.getElementById('e-name').value, file: document.getElementById('e-img').files[0] } }
            });
            if(form) {
                Swal.fire({title:'กำลังบันทึก...', didOpen:()=>Swal.showLoading()});
                const proc = (b64) => {
                    fetch(GAS_URL, {method:'POST', mode:'no-cors', body: JSON.stringify({action:'updateProfile', phone:userPhone, name:form.name, oldImg:userImg, imgBase64:b64})}).then(()=>{
                        localStorage.setItem('unexName', form.name); userName = form.name;
                        if(b64) { localStorage.setItem('unexImg', b64); userImg = b64; }
                        Swal.fire('สำเร็จ', '', 'success').then(()=>init());
                    });
                };
                if(form.file) { const r = new FileReader(); r.onload=(e)=>proc(e.target.result); r.readAsDataURL(form.file); } else proc('');
            }
        }

        async function openAddCarModal() {
            const { value: car } = await Swal.fire({
                title: 'เพิ่มรถในโรงรถ',
                html: `<input id="c-brand" placeholder="ยี่ห้อ (เช่น BMW)" class="swal2-input"><input id="c-model" placeholder="รุ่น (เช่น E46 320i)" class="swal2-input"><input id="c-year" placeholder="ปี ค.ศ. (เช่น 2004)" class="swal2-input"><input id="c-color" placeholder="สีรถ" class="swal2-input"><textarea id="c-detail" placeholder="รายละเอียดแต่งรถ (ล้อ, ช่วงล่าง, เครื่อง)" class="swal2-textarea"></textarea><label class="text-xs text-left block">รูปรถ</label><input id="c-img" type="file" class="swal2-file" accept="image/*">`,
                preConfirm: () => {
                    return { brand: v('c-brand'), model: v('c-model'), year: v('c-year'), color: v('c-color'), detail: v('c-detail'), file: document.getElementById('c-img').files[0] }
                }
            });
            if(car) {
                Swal.fire({title:'กำลังบันทึก...', didOpen:()=>Swal.showLoading()});
                const proc = (b64) => {
                    fetch(GAS_URL, {method:'POST', mode:'no-cors', body: JSON.stringify({action:'addCar', phone:userPhone, brand:car.brand, model:car.model, year:car.year, color:car.color, detail:car.detail, imgBase64:b64})}).then(()=>{
                        Swal.fire('สำเร็จ', 'เพิ่มรถสำเร็จ', 'success').then(()=>init());
                    });
                };
                if(car.file) { const r = new FileReader(); r.onload=(e)=>proc(e.target.result); r.readAsDataURL(car.file); } else proc('');
            }
        }

        async function deleteCar(carId) {
            if((await Swal.fire({title:'ลบรถคันนี้?', icon:'warning', showCancelButton:true})).isConfirmed) {
                await fetch(GAS_URL, {method:'POST', mode:'no-cors', body: JSON.stringify({action:'deleteCar', carId:carId})});
                init(); Swal.fire('ลบสำเร็จ', '', 'success');
            }
        }

        // --- ระบบ Authentication & Login Persistence ---
        async function profileAuth() {
            const { value: phone } = await Swal.fire({ title: 'เข้าสู่ระบบ', input: 'tel', inputPlaceholder: 'กรอกเบอร์โทรศัพท์ของคุณ' });
            if (!phone) return;
            Swal.fire({title:'กำลังตรวจสอบ...', didOpen:()=>Swal.showLoading()});
            const res = await fetch(`${GAS_URL}?action=checkUser&phone=${phone}`);
            const data = await res.json();
            
            if(data.status === 'success') {
                localStorage.setItem('unexPhone', phone); localStorage.setItem('unexName', data.name); localStorage.setItem('unexImg', data.profileImg||'');
                userPhone = phone; userName = data.name; userImg = data.profileImg||'';
                Swal.fire('สำเร็จ', `ยินดีต้อนรับคุณ ${userName}`, 'success').then(()=>location.reload());
            } else {
                let brandOpts = (appData.brands||[]).map(b => `<option value="${b[1]}">${b[1]}</option>`).join('');
                const { value: form } = await Swal.fire({
                    title: 'ลงทะเบียนสมาชิกใหม่', html: `<input id="r-name" placeholder="ชื่อ-นามสกุล" class="swal2-input"><select id="r-brand" class="swal2-input"><option value="">เลือกแบรนด์รถ</option>${brandOpts}</select><input id="r-car" placeholder="รุ่นรถ - ทะเบียน" class="swal2-input">`,
                    preConfirm: () => { return { name: v('r-name'), brand: v('r-brand'), car: v('r-car') } }
                });
                if(form) {
                    await fetch(GAS_URL, {method:'POST', mode:'no-cors', body: JSON.stringify({action:'register', phone:phone, name:form.name, carData: `${form.brand} ${form.car}`})});
                    localStorage.setItem('unexPhone', phone); localStorage.setItem('unexName', form.name);
                    Swal.fire('สำเร็จ', 'ลงทะเบียนเรียบร้อย', 'success').then(()=>location.reload());
                }
            }
        }
        function logout() { localStorage.clear(); location.reload(); }
        function checkAuth() { if(!userPhone) { profileAuth(); return false; } return true; }

        // ฟังก์ชันอื่นๆ ยังอยู่ครบถ้วนเหมือนเดิม (Feed, Events, Shop, Cart, Map, ReadMore)
        function renderEvents() {
            let html = '';
            (appData.events||[]).forEach(e => { 
                let imgHtml = (e[6] && e[6].trim() !== '') ? `<img src="${fixImg(e[6])}" class="w-24 h-24 rounded-lg object-cover">` : '';
                html += `<div class="bg-cardbg border border-neutral-800 rounded-xl p-3 flex gap-3 cursor-pointer" onclick="pinMap(${e[4]}, ${e[5]}, '${e[1]}')">
                    ${imgHtml}
                    <div class="flex-1">
                        <span class="text-xs text-primary font-bold">📅 ${new Date(e[2]).toLocaleString('th-TH')}</span>
                        <h3 class="font-semibold text-sm leading-tight my-1">${e[1]}</h3>
                        <p class="text-xs text-neutral-400 line-clamp-2">${e[7] || ''}</p>
                        <button onclick="readMore('event', '${e[0]}'); event.stopPropagation();" class="text-primary text-[10px] underline mt-1 block">รายละเอียดจัดงาน</button>
                    </div></div>`;
            });
            document.getElementById('eventList').innerHTML = html || '<p>ไม่มีอีเวนต์</p>';
            if(appData.events && appData.events.length > 0 && appData.events[0][4]) initMap(appData.events[0][4], appData.events[0][5], appData.events[0][1]);
        }

        function renderShop() {
            let html = '';
            (appData.shop||[]).forEach(s => { 
                if(s[5] !== 'Active') return;
                let imgHtml = (s[4] && s[4].trim() !== '') ? `<img src="${fixImg(s[4])}" onclick="readMore('shop', '${s[0]}')" class="h-32 w-full object-cover cursor-pointer">` : `<div onclick="readMore('shop', '${s[0]}')" class="h-32 bg-neutral-800 flex items-center justify-center cursor-pointer text-xs text-gray-500">ไม่มีรูปภาพ</div>`;
                html += `<div class="bg-cardbg border border-neutral-800 rounded-xl overflow-hidden flex flex-col justify-between h-auto pb-2">
                    ${imgHtml}
                    <div class="p-3 flex flex-col flex-1 justify-between">
                        <div><h4 class="font-semibold text-xs line-clamp-2">${s[1]}</h4><button onclick="readMore('shop', '${s[0]}')" class="text-primary text-[10px] underline mt-1">รายละเอียดสินค้า</button></div>
                        <div class="mt-2"><p class="text-primary font-bold text-sm mb-1">฿${s[3]}</p><button onclick="addCart('${s[0]}', '${s[1]}', ${s[3]})" class="bg-primary text-white text-xs w-full py-1.5 rounded">เพิ่มลงตะกร้า</button></div>
                    </div></div>`;
            }); document.getElementById('shopList').innerHTML = html || '<p>ไม่มีสินค้า</p>';
        }

        function readMore(type, id) {
            let title = '', html = '', imgTag = '';
            if (type === 'news') {
                let r = appData.news.find(x => String(x[0])===String(id));
                title = r[1]; imgTag = r[3] ? `<img src="${fixImg(r[3])}" class="w-full rounded-lg mb-3">` : '';
                html = `${imgTag}<div class="text-left text-sm text-gray-800 whitespace-pre-line">${r[2]}</div>`;
            } else if (type === 'event') {
                let r = appData.events.find(x => String(x[0])===String(id));
                title = r[1]; imgTag = r[6] ? `<img src="${fixImg(r[6])}" class="w-full rounded-lg mb-3">` : '';
                html = `${imgTag}<div class="text-left text-sm text-gray-800 whitespace-pre-line"><b>สถานที่:</b> ${r[3]}<br><b>วันที่:</b> ${new Date(r[2]).toLocaleString('th-TH')}<br><br>${r[7]||'ไม่มีรายละเอียดเพิ่มเติม'}</div>`;
            } else if (type === 'shop') {
                let r = appData.shop.find(x => String(x[0])===String(id));
                title = r[1]; imgTag = r[4] ? `<img src="${fixImg(r[4])}" class="w-full rounded-lg mb-3">` : '';
                html = `${imgTag}<div class="text-left text-sm text-gray-800 whitespace-pre-line mb-3">${r[2]||'ไม่มีรายละเอียด'}</div><div class="text-left font-bold text-lg text-primary">ราคา ฿${r[3]}</div>`;
            }
            Swal.fire({ title: title, html: html, confirmButtonText: 'ปิดหน้าต่าง', confirmButtonColor: '#dc2626' });
        }

        async function postComment(newsId) {
            if(!checkAuth()) return;
            const text = v(`cmt-${newsId}`); if(!text) return;
            document.getElementById(`cmt-${newsId}`).value = '';
            appData.comments.push([new Date().getTime(), newsId, userPhone, userName, text, 'Just now', userImg]); renderFeed(); 
            await fetch(GAS_URL, {method:'POST', mode:'no-cors', body: JSON.stringify({action:'addComment', newsId:newsId, phone:userPhone, name:userName, text:text, profileImg:userImg})});
        }
        async function editComment(commentId, oldText) {
            const { value: newText } = await Swal.fire({ title: 'แก้ไขข้อความ', input: 'text', inputValue: oldText });
            if(newText && newText !== oldText) {
                appData.comments.find(c => String(c[0])===String(commentId))[4] = newText; renderFeed();
                await fetch(GAS_URL, {method:'POST', mode:'no-cors', body: JSON.stringify({action:'editComment', commentId:commentId, text:newText})});
            }
        }

        function initMap(lat, lng, title) { if(!map) { map = L.map('map').setView([lat, lng], 15); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map); } pinMap(lat, lng, title); }
        function pinMap(lat, lng, title) { if(!map || !lat || !lng) return; if(marker) map.removeLayer(marker); map.setView([lat, lng], 15); marker = L.marker([lat, lng]).addTo(map).bindPopup(`<b>${title}</b>`).openPopup(); }

        function addCart(id, name, price) {
            if(!checkAuth()) return;
            if(cart[id]) cart[id].qty++; else cart[id] = { name, price, qty: 1 };
            let qty = Object.values(cart).reduce((s, i) => s + i.qty, 0); document.getElementById('cartCount').innerText = qty;
            document.getElementById('cartBtn').style.display = qty > 0 ? 'flex' : 'none';
        }
        
        async function viewCart() {
            let total = 0, html = `<div class="text-left text-sm max-h-60 overflow-y-auto mb-4 border-b pb-2">`;
            for(let id in cart) {
                let item = cart[id]; total += (item.price * item.qty);
                html += `<div class="flex justify-between items-center pb-2"><div><b>${item.name}</b><br>฿${item.price}</div>
                    <div class="flex items-center gap-2"><button onclick="cart['${id}'].qty--; if(cart['${id}'].qty<=0) delete cart['${id}']; Swal.close(); viewCart();" class="bg-gray-200 px-2 rounded text-black">-</button><span>${item.qty}</span><button onclick="cart['${id}'].qty++; Swal.close(); viewCart();" class="bg-gray-200 px-2 rounded text-black">+</button></div></div>`;
            }
            html += `</div><h3 class="font-bold text-lg text-primary mb-2">ยอดชำระ: ฿${total}</h3>`;
            let payInfo = appData.config.PromptPay ? `สแกนพร้อมเพย์:<br><b class="text-red-500">${appData.config.BankAccount || ''}</b><br><img src="https://promptpay.io/${appData.config.PromptPay}/${total}.png" class="mx-auto w-40 rounded">` : 'ชำระที่หน้างาน';

            const { value, isConfirmed } = await Swal.fire({ title: '🛒 สั่งซื้อสินค้า', html: html + `<div class="text-xs text-gray-600 my-2">${payInfo}</div>`, input: appData.config.PromptPay ? 'file' : null, confirmButtonText: 'โอนเงินและสั่งซื้อ', showCancelButton: true, preConfirm: () => { return Swal.getInput()?.files[0]; } });

            if (isConfirmed) {
                Swal.fire({title:'กำลังประมวลผล...', didOpen:()=>Swal.showLoading()});
                const proc = (b64) => { fetch(GAS_URL, {method:'POST', mode:'no-cors', body: JSON.stringify({ action:'checkout', phone:userPhone, cart:cart, total:total, slipBase64:b64 })}).then(() => { cart = {}; document.getElementById('cartBtn').style.display='none'; Swal.fire('สำเร็จ', 'ส่งออเดอร์เรียบร้อย', 'success'); }); };
                if(value) { const r = new FileReader(); r.onload = (e) => proc(e.target.result); r.readAsDataURL(value); } else proc('');
            }
        }

        function v(id) { return document.getElementById(id) ? document.getElementById(id).value : ''; }
        window.onload = init;
    </script>
</body>
</html>
